version: 1
# The Software Factory's settings. Values go in hub.settings.yaml.
# Check them with `hubzoid hub configure . --check` and see them with `hubzoid hub settings .`.
settings:
  - name: FACTORY_REPO
    description: The repository the factory works on. Either owner/name on GitHub, one of the repositories of the GitHub connection, or the path of a Git folder on this computer (starting with / or ~/), which needs no GitHub and ends in a reviewed local branch. Add @branch (owner/name@dev) to build on, and open pull requests into, that branch instead of the repository's GitHub default branch. Set this or FACTORY_REPOS, not both.
    regex: '^(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,38})/[A-Za-z0-9._-]{1,100}(?:@[^\s@]{1,200})?|~?/.+)$'
    example: example-org/factory-sample
  - name: FACTORY_REPOS
    type: string_list
    description: Several repositories for one factory, each owner/name or owner/name@branch, up to 50. Leave FACTORY_REPO empty when you use this. A work item uses exactly one of them; with several, a ClickUp task names it with a tag equal to the repository's short name (or owner/name), and chat names it. Short names must be unique.
    example: [example-org/api@dev, example-org/web]
  - name: FACTORY_LABEL
    description: The issue label that hands an issue to the factory. Adding it starts unattended work that ends in a draft pull request.
    default: factory
    regex: '^[^\s].{0,49}$'
  - name: FACTORY_BRANCH_PREFIX
    description: Prefix of every branch the factory creates. Only branches the factory pushed itself get CI repairs.
    default: factory/
    regex: '^[A-Za-z0-9][A-Za-z0-9._-]{0,30}/$'
  - name: FACTORY_BOT_NAME
    description: The name people mention to ask the factory something on GitHub. Leave empty to use the GitHub App's own name. Token mode needs it set.
    default: ""
    regex: '^$|^[A-Za-z0-9][A-Za-z0-9-]{0,38}$'
  - name: FACTORY_GITHUB_CONNECTION
    description: The id of the GitHub channel connection (channels/<id>.yaml) the factory reads and writes through.
    default: github
    regex: '^[a-z0-9][a-z0-9_-]{0,63}$'
  - name: FACTORY_LINEAR_CONNECTION
    description: The id of the Linear channel connection, when Linear is in FACTORY_CHANNELS.
    default: ""
    regex: '^$|^[a-z0-9][a-z0-9_-]{0,63}$'
  - name: FACTORY_SLACK_CONNECTION
    description: The id of the Slack channel connection, when Slack is in FACTORY_CHANNELS.
    default: ""
    regex: '^$|^[a-z0-9][a-z0-9_-]{0,63}$'
  - name: FACTORY_CLICKUP_CONNECTION
    description: The id of the ClickUp channel connection. A task moved to its trigger status starts work when clickup is in FACTORY_CHANNELS, and a ClickUp task named in chat is read through it.
    default: ""
    regex: '^$|^[a-z0-9][a-z0-9_-]{0,63}$'
  - name: FACTORY_CHANNELS
    description: Where people may ask the factory for work. Each enabled channel must pass doctor.
    type: string_list
    default: [chat, mcp, github]
    enum: [chat, mcp, github, linear, clickup, slack]
  - name: FACTORY_CI_BEFORE_PR
    description: True makes the factory wait for the repository's own checks (GitHub Actions or other check runs) on the reviewed commit before it opens the draft pull request. Failing checks go back to the implementer within FACTORY_REVIEW_CYCLES, and no pull request opens while they fail. The repository's CI must run on a push to the factory's branches.
    type: boolean
    default: false
  - name: FACTORY_CI_WAIT_MINUTES
    description: How long to wait for those checks before opening the pull request anyway, with a note.
    type: integer
    default: 30
    minimum: 1
    maximum: 120
  - name: FACTORY_INTAKE_ENABLED
    description: False stops new work after the hub restarts. Waiting decisions, recovery and cancellation still work. To stop GitHub events at once, pause the channel.
    type: boolean
    default: true
  - name: FACTORY_REQUIRE_PLAN_APPROVAL
    description: True makes attended implementation wait for the requester to approve the exact plan. Unattended label work never waits on a person.
    type: boolean
    default: true
  - name: FACTORY_PLAN_FORMAT
    description: The plan file people approve, attached to the task where the channel can attach files. markdown is a .md file; html is one clean page.
    default: markdown
    regex: '^(markdown|html)$'
  - name: FACTORY_REVIEW_CYCLES
    description: How many times the implementer may revise after the reviewer requests changes (0 to 2).
    type: integer
    default: 2
    minimum: 0
    maximum: 2
  - name: FACTORY_CI_ATTEMPTS
    description: How many CI repair attempts the factory makes on a branch it owns before handing over to a person (0 to 2).
    type: integer
    default: 2
    minimum: 0
    maximum: 2
  - name: FACTORY_DESK_ATTEMPTS
    description: How many times the factory fixes Engineering Desk's blocking findings on one of its pull requests before handing over to a person (0 to 2). Counted apart from CI repair attempts. Needs the GitHub channel's status_failures rule (SETUP.md).
    type: integer
    default: 2
    minimum: 0
    maximum: 2
  - name: FACTORY_BUILDS
    description: Where the analyst, implementer and reviewer work. auto uses Docker when it is running, else builds locally. docker always uses Docker. local always builds locally (macOS for now), with commands confined to a work folder, offline and without credentials.
    default: auto
    regex: '^(auto|docker|local)$'
  - name: FACTORY_SANDBOX_PROFILE
    description: The Docker sandbox profile (sandboxes/<id>.yaml) the analyst, implementer and reviewer use. Its setup command installs the repository's dependencies before the agent starts, offline.
    default: factory
    regex: '^[a-z0-9][a-z0-9_-]{0,63}$'
  - name: FACTORY_LOCAL_SETUP
    description: For local builds, the command that installs the repository's dependencies in each new work folder, before the agent starts. It runs in the repository's folder, reaches only the package registries in sandboxes/factory.yaml, and may write only the work folder. Put Python dependencies in "$FACTORY_ENV" (a virtual environment outside the repository), which is first on PATH afterwards. Empty means no setup.
    default: ""
