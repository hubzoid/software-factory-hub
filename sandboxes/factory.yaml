version: 1
description: The factory's checkout for analysis, implementation and review. Offline while the agent works.
image:
  base: hubzoid-default
resources:
  cpus: 2
  memory_mib: 2048
  pids: 1024
lifecycle:
  idle_stop_seconds: 900
  max_lifetime_seconds: 21600
  max_job_seconds: 1800
  command_timeout_seconds: 300
network:
  setup: {mode: allowlist, presets: [registries-v1], allow_hosts: []}
  agent: {mode: deny_all}
# The reviewed setup command. It runs once per sandbox, before the agent starts,
# with only the package registries reachable. A model can never change it.
# It also gives the checkout a commit identity: the implementer commits, and is
# told never to set one itself. SETUP.md step 2 replaces it with your GitHub
# App's bot. The default image's Python refuses plain installs (PEP 668); the
# sandbox is thrown away after the work, so installing into it is safe.
setup:
  command: "git config user.name 'Software Factory' && git config user.email 'software-factory@example.invalid' && python3 -m pip install --quiet --disable-pip-version-check --break-system-packages -r requirements-dev.txt"
  cwd: repo
  timeout_seconds: 900
env:
  PYTHONDONTWRITEBYTECODE: "1"
